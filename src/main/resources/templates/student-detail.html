<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Thông tin chi tiết Sinh Viên</h2>
    
    <div class="card mt-3" style="width: 25rem;">
        <div class="card-body">
            <h5 class="card-title" th:text="${student.name}">Tên sinh viên</h5>
            <p class="card-text"><strong>ID:</strong> <span th:text="${student.id}"></span></p>
            <p class="card-text"><strong>Email:</strong> <span th:text="${student.email}"></span></p>
            <p class="card-text"><strong>Tuổi:</strong> <span th:text="${student.age}"></span></p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/students}" class="btn btn-secondary">Quay lại</a>
        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning">Chỉnh Sửa</a>
        <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-danger" 
           onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không?');">Xóa</a>
    </div>
</body>
</html>
