<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Sinh Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1e3c;
            --navy-light: #1a2f5a;
            --accent: #e8a020;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f4f6fb;
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: var(--navy);
            padding: 28px 48px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 24px rgba(15,30,60,0.18);
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 1.6rem;
        }

        .header-sub {
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            font-weight: 300;
            margin-top: 2px;
        }

        .main {
            max-width: 560px;
            margin: 48px auto;
            padding: 0 24px;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .breadcrumb {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .breadcrumb a {
            color: var(--navy);
            text-decoration: none;
            font-weight: 500;
        }

        .breadcrumb a:hover { text-decoration: underline; }

        .form-card {
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 4px 32px rgba(15,30,60,0.09);
            overflow: hidden;
        }

        .form-card-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            padding: 28px 32px;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 1.4rem;
        }

        .form-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .form-body {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 8px;
        }

        .label-icon {
            width: 22px;
            height: 22px;
            background: #f4f6fb;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--navy);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(15,30,60,0.08);
        }

        .form-control[readonly] {
            background: #f3f4f6;
            color: var(--muted);
            cursor: not-allowed;
        }

        .form-control::placeholder { color: #c0c6d0; }

        .divider {
            height: 1px;
            background: #f1f3f6;
            margin: 0 32px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            padding: 24px 32px;
            background: #fafbfc;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 22px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.18s;
        }

        .btn-save {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 2px 12px rgba(15,30,60,0.2);
        }
        .btn-save:hover { background: var(--navy-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(15,30,60,0.25); }

        .btn-cancel {
            background: #f3f4f6;
            color: var(--muted);
            border: 1.5px solid var(--border);
        }
        .btn-cancel:hover { background: #e5e7eb; color: var(--text); }

        .required-note {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .required-note span { color: #dc2626; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">🎓</div>
        <div>
            <h1>Quản Lý Sinh Viên</h1>
            <div class="header-sub">Student Management System</div>
        </div>
    </div>

    <div class="main">
        <div class="breadcrumb">
            <a th:href="@{/students}">← Danh sách sinh viên</a>
            &nbsp;/&nbsp;
            <span th:text="${student.id == null} ? 'Thêm mới' : 'Chỉnh sửa'">Form</span>
        </div>

        <div class="form-card">
            <div class="form-card-header">
                <div class="form-title" th:text="${student.id == null} ? '✦ Thêm Sinh Viên Mới' : '✦ Cập Nhật Sinh Viên'">Form</div>
                <div class="form-subtitle" th:text="${student.id == null} ? 'Điền đầy đủ thông tin bên dưới' : 'Chỉnh sửa thông tin sinh viên'">Subtitle</div>
            </div>

            <form th:action="@{/students/save}" th:object="${student}" method="post">
                <div class="form-body">

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">🪪</span> ID Sinh Viên
                        </label>
                        <input type="text" th:field="*{id}" class="form-control"
                               th:readonly="${student.name != null}"
                               placeholder="Nhập mã số sinh viên..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">👤</span> Họ và Tên
                        </label>
                        <input type="text" th:field="*{name}" class="form-control"
                               placeholder="Nhập họ và tên đầy đủ..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">📧</span> Email
                        </label>
                        <input type="email" th:field="*{email}" class="form-control"
                               placeholder="example@email.com" required>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">
                            <span class="label-icon">🎂</span> Tuổi
                        </label>
                        <input type="number" th:field="*{age}" class="form-control"
                               placeholder="Nhập tuổi..." min="1" max="100" required>
                    </div>

                </div>

                <div class="divider"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">💾 Lưu Thông Tin</button>
                    <a th:href="@{/students}" class="btn btn-cancel">✕ Hủy</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
