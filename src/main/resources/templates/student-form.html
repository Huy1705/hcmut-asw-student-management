<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 th:text="${student.id == null} ? 'Thêm Sinh Viên Mới' : 'Cập Nhật Sinh Viên'">Form Sinh Viên</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post" class="mt-3" style="max-width: 400px;">
        
        <div class="mb-3">
            <label class="form-label">ID Sinh Viên:</label>
            <input type="text" th:field="*{id}" class="form-control" th:readonly="${student.name != null}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Họ và Tên:</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Tuổi:</label>
            <input type="number" th:field="*{age}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Lưu thông tin</button>
        <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
