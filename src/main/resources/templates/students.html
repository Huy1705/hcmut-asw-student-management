<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f1e3c;
            --navy-light: #1a2f5a;
            --accent: #e8a020;
            --accent-soft: #fdf3e3;
            --text: #1a1a2e;
            --muted: #6b7280;
            --border: #e5e7eb;
            --surface: #ffffff;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f4f6fb;
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--navy);
            padding: 28px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 24px rgba(15,30,60,0.18);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
        }

        .header-sub {
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
            font-weight: 300;
            margin-top: 2px;
        }

        /* Main content */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-form {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            transition: border-color 0.2s;
        }

        .search-form:focus-within {
            border-color: var(--navy);
        }

        .search-icon {
            color: var(--muted);
            font-size: 16px;
        }

        .search-form input[type="text"] {
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--text);
            background: transparent;
            width: 220px;
        }

        .search-form input::placeholder { color: #b0b7c3; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.18s;
        }

        .btn-search {
            background: var(--navy);
            color: #fff;
        }
        .btn-search:hover { background: var(--navy-light); }

        .btn-reset {
            background: #f3f4f6;
            color: var(--muted);
            border: 1.5px solid var(--border);
        }
        .btn-reset:hover { background: #e9eaf0; color: var(--text); }

        .btn-add {
            background: var(--accent);
            color: var(--navy);
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(232,160,32,0.3);
        }
        .btn-add:hover {
            background: #d4911a;
            box-shadow: 0 4px 16px rgba(232,160,32,0.4);
            transform: translateY(-1px);
        }

        /* Table card */
        .table-card {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 2px 20px rgba(15,30,60,0.07);
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: var(--navy);
        }

        thead th {
            padding: 16px 20px;
            color: rgba(255,255,255,0.75);
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: left;
        }

        thead th:first-child { border-radius: 0; }

        tbody tr {
            border-bottom: 1px solid #f1f3f6;
            transition: background 0.15s;
            animation: rowIn 0.3s ease both;
        }

        @keyframes rowIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        tbody tr:hover { background: #f8f9fc; }
        tbody tr:last-child { border-bottom: none; }

        td {
            padding: 16px 20px;
            font-size: 0.9rem;
            color: var(--text);
        }

        .id-badge {
            display: inline-block;
            background: #eef1f8;
            color: var(--navy);
            font-weight: 600;
            font-size: 0.78rem;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 0.04em;
        }

        .name-cell {
            font-weight: 500;
        }

        .email-cell {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .age-cell {
            font-weight: 500;
        }

        /* Under 18 */
        .under-18 .name-cell {
            color: var(--danger);
        }

        .age-badge-warn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--danger-soft);
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .age-normal {
            color: #1e4d2b;
            background: #f0fdf4;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-detail {
            background: transparent;
            border: 1.5px solid var(--navy);
            color: var(--navy);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-block;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-detail:hover {
            background: var(--navy);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--muted);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p { font-size: 0.95rem; }

        /* --- CSS THÊM CHO PHÂN TRANG --- */
        .pagination-container {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end; /* Đẩy sang phải */
        }

        .pagination {
            display: flex;
            list-style: none;
            gap: 8px;
            background: var(--surface);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(15,30,60,0.04);
        }

        .page-item a, .page-item span {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 36px;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--muted);
            text-decoration: none;
            transition: all 0.2s;
        }

        .page-item a:hover {
            background: #f3f4f6;
            color: var(--navy);
        }

        .page-item.active a {
            background: var(--navy);
            color: #fff;
            box-shadow: 0 2px 8px rgba(15,30,60,0.2);
        }

        .page-item.disabled span {
            color: #ccc;
            cursor: not-allowed;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-icon">🎓</div>
            <div>
                <h1>Quản Lý Sinh Viên</h1>
                <div class="header-sub">Student Management System</div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="toolbar">
            <form th:action="@{/students}" method="get" class="search-form">
                <span class="search-icon">🔍</span>
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên sinh viên..." />
                <button type="submit" class="btn btn-search">Tìm kiếm</button>
                <a th:href="@{/students}" class="btn btn-reset">Tất cả</a>
            </form>

            <a th:href="@{/students/new}" class="btn btn-add">
                ＋ Thêm Sinh Viên
            </a>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Họ và Tên</th>
                        <th>Email</th>
                        <th>Tuổi</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${dsSinhVien}"
                        th:classappend="${student.age < 18} ? 'under-18' : ''">
                        <td><span class="id-badge" th:text="${student.id}">ID</span></td>
                        <td class="name-cell" th:text="${student.name}">Tên</td>
                        <td class="email-cell" th:text="${student.email}">Email</td>
                        <td>
                            <span th:if="${student.age < 18}" class="age-badge-warn">
                                ⚠ <span th:text="${student.age}">0</span>
                            </span>
                            <span th:if="${student.age >= 18}" class="age-normal" th:text="${student.age}">0</span>
                        </td>
                        <td>
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn-detail">Xem Chi Tiết →</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(dsSinhVien)}">
                        <td colspan="5">
                            <div class="empty-state">
                                <div class="empty-icon">📭</div>
                                <p>Không tìm thấy sinh viên nào.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container" th:if="${totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a th:if="${currentPage > 0}" th:href="@{/students(keyword=${keyword}, page=${currentPage - 1})}">« Trước</a>
                    <span th:if="${currentPage == 0}">« Trước</span>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                    th:classappend="${currentPage == i} ? 'active'">
                    <a th:href="@{/students(keyword=${keyword}, page=${i})}" th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a th:if="${currentPage < totalPages - 1}" th:href="@{/students(keyword=${keyword}, page=${currentPage + 1})}">Sau »</a>
                    <span th:if="${currentPage == totalPages - 1}">Sau »</span>
                </li>
            </ul>
        </div>
        </div>
</body>
</html>
