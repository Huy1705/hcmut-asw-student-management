<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Yêu cầu 7.2: Style cho sinh viên chưa đủ 18 tuổi */
        .under-18 {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Danh Sách Sinh Viên (SSR)</h1>

    <div style="margin-bottom: 20px;">
        <form th:action="@{/students}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Nhập tên sinh viên..." />
            <button type="submit">Tìm kiếm</button>
            <a th:href="@{/students}"><button type="button">Tất cả</button></a>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Tuổi</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${dsSinhVien}" 
                th:classappend="${student.age < 18} ? 'under-18' : ''">
                
                <td th:text="${student.id}">ID Mẫu</td>
                <td th:text="${student.name}">Tên Mẫu</td>
                <td th:text="${student.email}">Email Mẫu</td>
                <td th:text="${student.age}">0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
